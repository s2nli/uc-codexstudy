<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achiever 8.0 · CODEX STUDYS</title>
<meta name="theme-color" content="#090b10">
<link rel="icon" href="assets/mj-icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/mj-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --bg: #080a0f;
      --bg-raised: #0d1017;
      --panel: rgba(17, 21, 31, .82);
      --panel-solid: #11151f;
      --panel-soft: #151b27;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #f4f6fb;
      --muted: #8d96a8;
      --muted-bright: #b4bdcd;
      --brand: #8b7cff;
      --brand-bright: #a69cff;
      --mint: #55ddbb;
      --orange: #ffb36b;
      --danger: #ff7585;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --max: 1240px;
    }

    html[data-theme="light"] {
      --bg: #f4f5f9; --bg-raised: #ffffff; --panel: rgba(255,255,255,.86); --panel-solid: #ffffff; --panel-soft: #eef0f6;
      --line: rgba(20,22,35,.1); --line-strong: rgba(20,22,35,.18); --text: #14161f; --muted: #5b6072; --muted-bright: #383c4a;
      --brand: #6c5ce7; --brand-bright: #5b46e0; --mint: #12b899; --orange: #d9832a; --danger: #e0344f;
      --shadow: 0 24px 70px rgba(30,30,60,.14);
    }
    html[data-theme="sandalwood"] {
      --bg: #1c130c; --bg-raised: #241a10; --panel: rgba(43,31,20,.82); --panel-solid: #2b1f14; --panel-soft: #332417;
      --line: rgba(255,225,190,.1); --line-strong: rgba(255,225,190,.18); --text: #f6ead9; --muted: #b89a7c; --muted-bright: #d9c1a3;
      --brand: #cd8a4a; --brand-bright: #e6a75f; --mint: #b58a4f; --orange: #ff9d4d; --danger: #ff7c6b;
    }
    html[data-theme="forest-emerald"] {
      --bg: #06140f; --bg-raised: #0a1c15; --panel: rgba(12,32,24,.82); --panel-solid: #0e2318; --panel-soft: #122a1d;
      --line: rgba(180,255,220,.09); --line-strong: rgba(180,255,220,.17); --text: #eafff3; --muted: #83b39c; --muted-bright: #aed7c1;
      --brand: #2fbf7a; --brand-bright: #3fdd91; --mint: #55ddbb; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="ocean-deep"] {
      --bg: #050e17; --bg-raised: #081521; --panel: rgba(11,26,40,.82); --panel-solid: #0c1e2e; --panel-soft: #102636;
      --line: rgba(170,225,255,.09); --line-strong: rgba(170,225,255,.17); --text: #eaf6ff; --muted: #7ea3bd; --muted-bright: #a9cbe0;
      --brand: #2196e0; --brand-bright: #4db4ff; --mint: #2fd3c7; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="sakura-blossom"] {
      --bg: #fff3f6; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ffe4ec;
      --line: rgba(180,40,80,.1); --line-strong: rgba(180,40,80,.18); --text: #3c1420; --muted: #a26478; --muted-bright: #7a3a4c;
      --brand: #ec6f96; --brand-bright: #e14f7e; --mint: #16b39a; --orange: #e08a3c; --danger: #d9314f;
    }
    html[data-theme="dracula-midnight"] {
      --bg: #14121f; --bg-raised: #1b1830; --panel: rgba(38,33,64,.82); --panel-solid: #241f3d; --panel-soft: #2b2549;
      --line: rgba(220,200,255,.09); --line-strong: rgba(220,200,255,.17); --text: #f3ecff; --muted: #a08fc9; --muted-bright: #c6b7ea;
      --brand: #bd93f9; --brand-bright: #d6acff; --mint: #50fa7b; --orange: #ffb86c; --danger: #ff5555;
    }
    html[data-theme="lavender-mist"] {
      --bg: #f5f2fc; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ece5fb;
      --line: rgba(80,50,140,.1); --line-strong: rgba(80,50,140,.18); --text: #2c2140; --muted: #7a6a9c; --muted-bright: #4d3d70;
      --brand: #9b7be0; --brand-bright: #855fdb; --mint: #16b39a; --orange: #d9832a; --danger: #d9314f;
    }
    html[data-theme="cyberpunk-neon"] {
      --bg: #05020a; --bg-raised: #0a0512; --panel: rgba(20,8,32,.85); --panel-solid: #150a22; --panel-soft: #1c0e2c;
      --line: rgba(255,60,220,.16); --line-strong: rgba(255,60,220,.3); --text: #f2e9ff; --muted: #b48ad9; --muted-bright: #e2b8ff;
      --brand: #ff2ec4; --brand-bright: #ff5be0; --mint: #2af5ff; --orange: #ffb36b; --danger: #ff3860;
    }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.back{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel-solid);color:var(--brand-bright)}
.back svg{width:18px;height:18px}
.topbar h1{font:600 19px/1.2 "Space Grotesk",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hero{border:1px solid var(--line);border-radius:22px;background:var(--panel-solid);overflow:hidden;margin-bottom:16px}
.hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--panel-soft)}
.hero-body{padding:18px 18px 20px}
.hero-body h2{font:700 26px/1.15 "Space Grotesk",sans-serif;margin-bottom:8px}
.hero-body p{color:var(--muted-bright);font-size:16px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted-bright);font-size:14px;font-weight:600}
.chip.on{color:var(--brand-bright);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tab{padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel-solid);color:var(--muted-bright);font-weight:600;font-size:16px;transition:.15s}
.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--brand-bright),var(--brand));box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 35%,transparent)}
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel-solid);width:100%;text-align:left}
button.row:active{transform:scale(.99)}
.ic{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--panel-soft);color:var(--brand-bright)}
.ic svg{width:24px;height:24px}
.row .meta{flex:1;min-width:0}
.row .t{font:600 17px/1.3 "Space Grotesk",sans-serif;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:15px;margin-top:3px}
.row .chev{width:18px;height:18px;color:var(--muted-bright);flex:none}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel-solid);color:var(--text);font:inherit;font-size:16px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--brand)}
.count{color:var(--muted);font-size:14px;margin:0 2px 10px}
.num{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--panel-soft);color:var(--brand-bright);font:600 14px "Space Grotesk",sans-serif}
.acts{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:11px;font-weight:600;font-size:14px;border:1px solid var(--line-strong);color:var(--text);background:var(--panel-soft)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--brand-bright),var(--brand))}
.btn svg{width:16px;height:16px}
.lec{align-items:flex-start;flex-wrap:wrap}
.lec .acts{width:100%;padding-left:52px}
.more{margin:16px auto 0;display:block;padding:13px 26px;border-radius:14px;border:1px solid var(--line-strong);background:var(--panel-solid);font-weight:600}
.about{border:1px solid var(--line);border-radius:18px;background:var(--panel-solid);padding:20px;color:var(--muted-bright);line-height:1.65;font-size:16px}
.about h3{font:600 18px "Space Grotesk",sans-serif;color:var(--text);margin:0 0 8px}
.about h3:not(:first-child){margin-top:20px}
.about ul{padding-left:20px}
.about li{margin:4px 0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.skel{height:78px;border-radius:18px;background:linear-gradient(90deg,var(--panel-solid),var(--panel-soft),var(--panel-solid));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <h1 id="pageTitle">Achiever 8.0</h1>
</header>
<main class="wrap">
  <section class="hero" id="hero">
    <img class="hero-img" id="heroImg" src="assets/achiever-8-0.jpg" alt="Achiever 8.0">
    <div class="hero-body">
      <h2 id="batchName">Achiever 8.0</h2>
      <p id="batchSub">Dedicated for SSC CGL Exams</p>
      <div class="chips"><span class="chip on">Recorded</span><span class="chip">SSC CGL</span></div>
    </div>
  </section>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="lectures">Lectures</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="about">About</button>
  </nav>
  <div id="view"><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
</main>
<script>
(function(){var t=localStorage.getItem("codex-studys-theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t)})();
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const I={
  vid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 5-3v9l-5-3"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
};
const PAGE=40;
let DATA=null, BATCH=null, shown=PAGE, query="";

function route(){
  const h=(location.hash||"#lectures").slice(1).split("/");
  return {tab:["lectures","notes","about"].includes(h[0])?h[0]:"lectures", folder:h[1]||""};
}
function go(hash){location.hash=hash}

function render(){
  const r=route();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===r.tab));
  const view=$("#view");
  const inFolder=!!r.folder && DATA && DATA.folders.some(f=>f.key===r.folder);
  const f=inFolder?DATA.folders.find(x=>x.key===r.folder):null;
  $("#pageTitle").textContent=f?f.name:(BATCH&&BATCH.name||"Achiever 8.0");
  $("#hero").style.display=f?"none":"";
  $("#tabs").style.display=f?"none":"";
  if(!DATA){return}
  if(r.tab==="about"){view.innerHTML=aboutHtml();return}
  if(!f){
    const isN=r.tab==="notes";
    view.innerHTML='<div class="list">'+DATA.folders.map(x=>{
      const n=isN?x.noteCount:x.lectureCount;
      return '<button class="row" data-open="'+esc(x.key)+'"><span class="ic">'+(isN?I.doc:I.vid)+'</span><span class="meta"><div class="t">'+esc(x.name)+'</div><div class="s">'+n+(isN?' notes':' lectures')+'</div></span>'+I.chev+'</button>';
    }).join("")+'</div>';
    view.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{shown=PAGE;query="";go(r.tab+"/"+b.dataset.open)});
    return;
  }
  renderFolder(f,r.tab);
}

function renderFolder(f,tab){
  const isN=tab==="notes";
  const all=isN?f.notes:f.lectures;
  const q=query.trim().toLowerCase();
  const list=q?all.filter(x=>(x.t+" "+(x.s||"")).toLowerCase().includes(q)):all;
  const slice=list.slice(0,shown);
  const view=$("#view");
  const keepFocus=document.activeElement&&document.activeElement.id==="q";
  view.innerHTML='<input class="search" id="q" type="search" placeholder="Search '+(isN?'notes':'lectures')+'…" value="'+esc(query)+'" autocomplete="off">'
   +'<div class="count">'+list.length+(isN?' notes':' lectures')+'</div>'
   +(slice.length?'<div class="list">'+slice.map((x,i)=>isN?noteRow(x):lecRow(x,all.indexOf(x)+1)).join("")+'</div>':'<div class="empty">Nothing found.</div>')
   +(list.length>shown?'<button class="more" id="more">Show more ('+(list.length-shown)+' left)</button>':'');
  const qi=$("#q");
  qi.oninput=e=>{query=e.target.value;shown=PAGE;renderFolder(f,tab);};
  if(keepFocus){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  const m=$("#more");if(m)m.onclick=()=>{shown+=PAGE;renderFolder(f,tab)};
}
function lecRow(x,n){
  return '<div class="row lec"><span class="num">'+n+'</span><span class="meta"><div class="t">'+esc(x.t)+'</div>'+(x.s?'<div class="s">'+esc(x.s)+'</div>':'')+'</span>'
   +'<div class="acts"><a class="btn primary" href="'+esc(x.v)+'" target="_blank" rel="noopener">'+I.play+' Watch</a>'
   +(x.p?'<a class="btn" href="'+esc(x.p)+'" target="_blank" rel="noopener">'+I.doc+' Notes</a>':'')+'</div></div>';
}
function noteRow(x){
  return '<a class="row" href="'+esc(x.p)+'" target="_blank" rel="noopener"><span class="ic">'+I.doc+'</span><span class="meta"><div class="t">'+esc(x.t)+'</div>'+(x.s?'<div class="s">'+esc(x.s)+'</div>':'')+'</span>'+I.chev+'</a>';
}
function aboutHtml(){
  const L=DATA.folders.reduce((a,f)=>a+f.lectureCount,0), N=DATA.folders.reduce((a,f)=>a+f.noteCount,0);
  return '<div class="about"><h3>'+esc(BATCH&&BATCH.name||"Achiever 8.0")+'</h3><p>Complete English Mastery Program based on the new pattern (Pre + Mains). '+esc(BATCH&&BATCH.byName||"")+'.</p>'
   +'<h3>Useful for</h3><p>SSC CGL, CPO, CHSL, Steno, MTS, CDS, NDA, Banking and other state exams.</p>'
   +'<h3>What is inside</h3><ul><li>Grammar batch: A to Z grammar, practice sessions, topic-wise spotting errors, mixed errors, sentence improvement</li><li>Practice batch: cloze test, passage, PQRS, errors &amp; sentence improvement, mains practice</li><li>Vocab batch: Samundramanthan of Vocabulary with videos and PDFs</li></ul>'
   +'<h3>Library</h3><p>'+L+' lectures and '+N+' notes across '+DATA.folders.length+' sections.</p></div>';
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));
$("#backBtn").onclick=()=>{
  const r=route();
  if(r.folder){go(r.tab);return}
  location.href="index.html#courses";
};
window.addEventListener("hashchange",()=>{shown=PAGE;query="";render();window.scrollTo(0,0)});

(async function init(){
  try{
    const [d,b]=await Promise.all([
      fetch("achiever-data.json").then(r=>{if(!r.ok)throw 0;return r.json()}),
      fetch("batches.json").then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    DATA=d;
    const id=new URLSearchParams(location.search).get("id")||"achiever-8-0";
    BATCH=b&&Array.isArray(b.batches)?b.batches.find(x=>(x._id||x.batch_id)===id):null;
    if(BATCH){
      $("#batchName").textContent=BATCH.name;$("#batchSub").textContent=BATCH.byName||"";
      document.title=BATCH.name+" · CODEX STUDYS";
      if(BATCH.previewImage)$("#heroImg").src=BATCH.previewImage;
    }
    render();
  }catch(e){
    $("#view").innerHTML='<div class="empty">Could not load the batch. Please refresh and try again.</div>';
  }
})();
</script>
</body>
</html>
